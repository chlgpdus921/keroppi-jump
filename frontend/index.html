<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEROPPI JUMP</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<script>
"use strict";

// ---- 상수 ----
const W = 640, H = 360, TILE = 16, PX = 2, STEP = 1 / 60; // PX: 스프라이트 한 칸의 픽셀 크기
const COYOTE = 0.1, JUMP_BUFFER = 0.1;
const GRAVITY = 1400, JUMP_V = 460, MAX_VX = 150, ACCEL = 1200, FRICTION = 1400, MAX_FALL = 600;
const JUMP_V2 = 430, AIR_JUMPS = 1; // 더블 점프: 공중에서 Space 한 번 더 (총 약 135px)
const IDLE_FRAME_TIME = 0.4;

// ---- 스프라이트: CLAWD (케로피 스타일 만화 개구리 + 산타 모자, 24x24) ----
// 위 7행은 산타 모자(그리기 전용), 아래 17행이 몸이다. 히트박스는 몸만 덮는다.
const CLAWD = [
  "...................FF...",
  "..............rrr.FFfF..",
  "...........rrrRRRrFfFF..",
  ".........rrRRRRRRRRrFF..",
  ".......rRRRRRRRRRRRRr...",
  ".....rRRRRRRRRRRRRRRRr..",
  "....FfFFfFFfFFfFFfFFf...",
  "...BBBBB........BBBBB...",
  "..BWWWWWB......BWWWWWB..",
  ".BWWWWBBWB....BWWWWBBWB.",
  ".BWWWBBBWB....BWWWBBBWB.",
  ".BWWWBBBWBOOOOBWWWBBBWB.",
  "OBWWWWWWWBGGGGBWWWWWWWBO",
  "OGBBBBBBBGGGGGGBBBBBBBGO",
  "OGGPPGGGGGGGGGGGGGGPPGGO",
  "OGGPPGOGGGGGGGGGGOGPPGGO",
  ".OGGGGGOTTTTTTTTOGGGGGO.",
  "..OGGGGGOOOOOOOOGGGGGO..",
  "....OGGGGGGGGGGGGGGO....",
  ".....OGGGGGGGGGGGGO.....",
  "...OGOGGGGGGGGGGGGOGO...",
  "...OOOGGGGGGGGGGGGOOO...",
  "......OGGGGGGGGGGO......",
  ".....OGGGO....OGGGO....."
];
const HAT_ROWS = 7;

const PALETTE = {
  G: "#8ED99A", // 몸 (연한 파스텔 초록)
  O: "#3F8F52", // 몸 외곽선
  W: "#FFFFFF", // 흰자
  B: "#14130F", // 눈 외곽선·눈동자
  P: "#FF9EB8", // 볼
  T: "#EF6B79", // 입 속
  R: "#E8283E", // 산타 모자
  r: "#A3122A", // 모자 외곽선
  F: "#FFF8F0", // 모자 털
  f: "#E3DDEB"  // 털 음영
};

const SPRITE_W = Math.max(...CLAWD.map((r) => r.length)); // 24열
// 24x24 배열을 PX=2로 그리면 48x48px. 히트박스 40x34는 몸(아래 17행)에 맞춘다.
const SPRITE_OX = 4;
const SPRITE_OY = HAT_ROWS * PX; // 모자 높이만큼 위로 올려 그린다

// 정지 시 2프레임 다리 애니메이션: 두 번째 프레임은 마지막 행(발)만 벌린다.
const CLAWD_IDLE_B = CLAWD.slice(0, -1).concat(["....OGGGO......OGGGO...."]);
const CLAWD_FRAMES = [CLAWD, CLAWD_IDLE_B];

// ---- 레벨 (타일 16px) ----
// X 지형, C 코인, ^ 가시, F 깃발, S 시작점, . 빈칸 (C/^/F 동작은 Phase 3)
const LEVEL = [
  "........................................................................................................................",
  "........................................................................................................................",
  "........................................................................................................................",
  "........................................................................................................................",
  "........................................................................................................................",
  "........................................................................................................................",
  "........................................................................................................................",
  "........................................................................................................................",
  "...........................................C.C.............................................CC...........................",
  "..........................................XXXXX...........................................XXXX..........................",
  "........................................................................................................................",
  "........................................................................................................................",
  "........................................................................................................................",
  ".....................................C.C.............................................C..................................",
  "....................................XXXXX...................C..C....................XXXX................................",
  "........................................................XXXXXXXXXXXX....................................................",
  "...............................C........................XXXXXXXXXXXX...........C.................C......................",
  ".............................XXXXX...........................................XXXXX..........................C...........",
  "...................XXX..................................................................................................",
  "................XXXXXX......................XX....C..........C..C..........................................XXX..........",
  "...S.........XXXXXXXXX......................XX........................^..................^^.............XXXXXX.....F....",
  "XXXXXXXXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXXXX....XXXXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXXXX....XXXXXXXXXXXXXXXXXXXX",
  "XXXXXXXXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXXXX....XXXXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXXXX....XXXXXXXXXXXXXXXXXXXX"
];
const levelW = LEVEL[0].length * TILE;
const levelH = LEVEL.length * TILE;

// 범위 밖: 좌·우·위는 벽, 아래는 빈칸(낙사 허용). S는 빈칸 취급.
function tileAt(tx, ty) {
  if (ty >= LEVEL.length) return ".";
  if (tx < 0 || tx >= LEVEL[0].length || ty < 0) return "X";
  const ch = LEVEL[ty][tx];
  return ch === "S" ? "." : ch;
}
function solidAt(tx, ty) { return tileAt(tx, ty) === "X"; }

// ---- 캔버스 ----
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

function resize() {
  const scale = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  canvas.style.width = W * scale + "px";
  canvas.style.height = H * scale + "px";
}
addEventListener("resize", resize);
resize();

// ---- 입력 ----
const GAME_KEYS = new Set(["ArrowLeft", "ArrowRight", "Space", "KeyR"]);
const keys = new Set();
let jumpPressed = false;   // 새 Space 입력 1회 플래그
let jumpReleased = false;  // Space 뗌 1회 플래그 (가변 점프)

addEventListener("keydown", (e) => {
  // Ctrl/Cmd/Alt 조합(새로고침, 뒤로가기 등)은 브라우저에 양보
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  if (e.repeat) return; // 자동반복 무시: 꾹 눌러도 한 번만 점프
  keys.add(e.code);
  if (e.code === "Space") jumpPressed = true;
});
addEventListener("keyup", (e) => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  keys.delete(e.code);
  if (e.code === "Space") jumpReleased = true;
});
addEventListener("blur", () => keys.clear()); // 포커스를 잃으면 눌린 키가 남지 않게

// ---- 플레이어 ----
const player = {
  x: 0, y: 0, w: SPRITE_W * PX - 2 * SPRITE_OX, h: (CLAWD.length - HAT_ROWS) * PX, // 40x34
  vx: 0, vy: 0, onGround: false, facing: 1,
  coyote: 0, buffer: 0, animT: 0, airJumps: 0
};

// S 타일 기준 시작점: 히트박스를 타일 가운데에, 발은 타일 바닥에
const spawn = (() => {
  const ty = LEVEL.findIndex((row) => row.includes("S"));
  const tx = LEVEL[ty].indexOf("S");
  return { x: tx * TILE + TILE / 2 - player.w / 2, y: (ty + 1) * TILE - player.h };
})();

function respawn() {
  const p = player;
  p.x = spawn.x; p.y = spawn.y;
  p.vx = p.vy = 0;
  p.coyote = p.buffer = 0;
  p.airJumps = 0;
  p.onGround = false;
  jumpPressed = jumpReleased = false;
  particles.length = 0;
}
const particles = [];
let time = 0;
respawn();

// 축 분리 AABB: 이동 후 겹친 solid 타일 쪽으로 밀어낸다
function overlapRange(p) {
  return {
    // 오른쪽/아래 끝은 ceil(...)-1: 소수 좌표에서 1px 미만으로 겹쳐도 판정한다
    tx0: Math.floor(p.x / TILE), tx1: Math.ceil((p.x + p.w) / TILE) - 1,
    ty0: Math.floor(p.y / TILE), ty1: Math.ceil((p.y + p.h) / TILE) - 1
  };
}
function moveX(dx) {
  const p = player;
  p.x += dx;
  if (dx !== 0) {
    const { tx0, tx1, ty0, ty1 } = overlapRange(p);
    // 진행 방향 앞쪽 타일부터 찾아 가장 가까운 벽에 붙인다
    const [start, end, step] = dx > 0 ? [tx0, tx1, 1] : [tx1, tx0, -1];
    outer:
    for (let tx = start; dx > 0 ? tx <= end : tx >= end; tx += step) {
      for (let ty = ty0; ty <= ty1; ty++) {
        if (solidAt(tx, ty)) {
          p.x = dx > 0 ? tx * TILE - p.w : (tx + 1) * TILE;
          p.vx = 0;
          break outer;
        }
      }
    }
  }
  p.x = Math.min(Math.max(p.x, 0), levelW - p.w);
}
function moveY(dy) {
  const p = player;
  p.onGround = false;
  p.y += dy;
  if (dy === 0) return;
  const { tx0, tx1, ty0, ty1 } = overlapRange(p);
  const [start, end, step] = dy > 0 ? [ty0, ty1, 1] : [ty1, ty0, -1];
  for (let ty = start; dy > 0 ? ty <= end : ty >= end; ty += step) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (solidAt(tx, ty)) {
        if (dy > 0) { p.y = ty * TILE - p.h; p.onGround = true; }
        else p.y = (ty + 1) * TILE;
        p.vy = 0;
        return;
      }
    }
  }
}

// ---- 카메라 ----
const cam = { x: 0, y: 0 };
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
function updateCamera() {
  const p = player;
  cam.x = clamp(p.x + p.w / 2 - W / 2, 0, levelW - W);
  cam.y = clamp(p.y + p.h / 2 - H / 2, 0, levelH - H);
}
updateCamera();

function update(dt) {
  const p = player;
  // 입력 → 가속/마찰
  const dir = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0);
  if (dir !== 0) {
    p.vx += dir * ACCEL * dt;
    p.vx = Math.max(-MAX_VX, Math.min(MAX_VX, p.vx));
    p.facing = dir;
  } else {
    const f = FRICTION * dt;
    p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
  }

  // 1. 점프 버퍼
  if (jumpPressed) { p.buffer = JUMP_BUFFER; jumpPressed = false; }
  else p.buffer -= dt;
  // 가변 점프: 상승 중 Space를 떼면 한 번 감속. 새 점프보다 먼저 처리해야
  // 같은 프레임에 "떼고 다시 누르기"를 했을 때 새 점프가 잘리지 않는다.
  if (jumpReleased) {
    if (p.vy < 0) p.vy *= 0.5;
    jumpReleased = false;
  }
  // 2. 코요테 타임 + 공중 점프 충전
  if (p.onGround) { p.coyote = COYOTE; p.airJumps = AIR_JUMPS; }
  else p.coyote -= dt;
  // 3. 점프: 땅(코요테 포함) 우선, 아니면 공중 점프(더블 점프)
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP_V;
    p.buffer = p.coyote = 0;
    p.onGround = false;
  } else if (p.buffer > 0 && p.airJumps > 0 && !p.onGround) {
    p.vy = -JUMP_V2;
    p.buffer = 0;
    p.airJumps--;
    burst(p.x + p.w / 2, p.y + p.h);
  }
  // 5. 중력 → 이동
  p.vy = Math.min(p.vy + GRAVITY * dt, MAX_FALL);
  moveX(p.vx * dt);
  moveY(p.vy * dt);
  if (p.y > levelH) respawn(); // 낙사 (Phase 3에서 가시도 같은 처리)
  updateCamera();

  // 파티클
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 120 * dt; q.life -= dt;
    if (q.life <= 0) particles.splice(i, 1);
  }
  time += dt;

  // 정지 애니메이션 타이머
  if (p.onGround && p.vx === 0) p.animT += dt;
  else p.animT = 0;
}

// ---- 렌더 ----
function drawClawd(ctx, x, y, flip, sprite = CLAWD) {
  for (let r = 0; r < sprite.length; r++) {
    const row = sprite[r];
    for (let c = 0; c < SPRITE_W; c++) {
      const ch = row[flip ? SPRITE_W - 1 - c : c];
      if (ch === undefined || ch === ".") continue;
      ctx.fillStyle = PALETTE[ch];
      ctx.fillRect(Math.round(x) + c * PX, Math.round(y) + r * PX, PX, PX);
    }
  }
}

// ---- 크리스마스 월드 아트 (전부 fillRect, 화면 밖은 잘라서 그린다) ----
function hash(a, b) {
  let h = (a * 374761393 + b * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
function rect(x, y, w, h, c) {
  const x0 = Math.max(0, Math.round(x)), y0 = Math.max(0, Math.round(y));
  const x1 = Math.min(W, Math.round(x + w)), y1 = Math.min(H, Math.round(y + h));
  if (x1 <= x0 || y1 <= y0) return;
  ctx.fillStyle = c;
  ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
}
function drawHeart(x, y, c) { // 5x4 픽셀 하트
  rect(x + 1, y, 1, 1, c); rect(x + 3, y, 1, 1, c);
  rect(x, y + 1, 5, 1, c); rect(x + 1, y + 2, 3, 1, c); rect(x + 2, y + 3, 1, 1, c);
}
function drawFlower(x, y) { // 3x3 꽃 + 줄기
  rect(x + 1, y, 1, 1, "#FFFFFF"); rect(x, y + 1, 1, 1, "#FFFFFF"); rect(x + 2, y + 1, 1, 1, "#FFFFFF");
  rect(x + 1, y + 2, 1, 1, "#FFFFFF"); rect(x + 1, y + 1, 1, 1, "#FFD84D"); rect(x + 1, y + 3, 1, 2, "#7BC67E");
}

// 하늘: 크리스마스 저녁 그라데이션 띠 + 경계 디더링
const SKY = ["#2E2A6B", "#3A3280", "#4A3A92", "#5D449F", "#7451A8", "#8E5FAF", "#A96DB4", "#C47FB8", "#DB95BE"];
function drawSky() {
  rect(0, 0, W, H, SKY[0]);
  const bh = Math.ceil(H / SKY.length);
  for (let i = 1; i < SKY.length; i++) {
    rect(0, i * bh, W, H - i * bh, SKY[i]);
    for (let x = (i % 2) * 4; x < W; x += 8) rect(x, i * bh - 4, 4, 4, SKY[i]);
  }
}

const STARS = Array.from({ length: 40 }, (_, i) => ({ x: hash(i, 1) % 1400, y: 6 + hash(i, 2) % 150, ph: (hash(i, 3) % 628) / 100 }));
function drawStars(cx) {
  for (const st of STARS) {
    const sx = (((st.x - cx * 0.05) % 1400) + 1400) % 1400 - 40;
    if (sx < -8 || sx > W + 8) continue;
    rect(sx, st.y, 2, 2, "#FFFFFF");
    if (Math.sin(time * 2.2 + st.ph) > 0.35) { rect(sx - 2, st.y, 6, 2, "#FFF2A8"); rect(sx, st.y - 2, 2, 6, "#FFF2A8"); }
  }
}

// 달: 4px 블록 원 + 후광
const MOON_SPANS = (() => {
  const out = [];
  for (const [r, c] of [[46, "#4F4396"], [38, "#6A5AAE"], [28, "#FFF6D8"]]) {
    for (let y = -r; y < r; y += 4) {
      const xo = Math.round(Math.sqrt(Math.max(0, r * r - (y + 2) * (y + 2))) / 4) * 4;
      if (xo > 0) out.push([c, -xo, y, 2 * xo]);
    }
  }
  for (const [x, y, w] of [[-12, -10, 8], [6, 4, 8], [-4, 12, 4]]) out.push(["#F1E3B8", x, y, w]); // 크레이터
  return out;
})();
function drawMoon(cx, cy) {
  const ox = Math.round(120 - cx * 0.04), oy = Math.round(70 - cy * 0.05);
  for (const [c, x, y, w] of MOON_SPANS) rect(ox + x, oy + y, w, 4, c);
}

// 눈 덮인 성 + 반짝이는 전구
function drawRoof(x, top, w, c) { // 계단식 원뿔 지붕, 꼭대기엔 눈
  let k = 0;
  for (; w - 4 * k > 0; k++) rect(x + 2 * k, top - (k + 1) * 4, w - 4 * k, 4, c);
  rect(x + 2 * (k - 2), top - k * 4, Math.max(4, w - 4 * (k - 2)), 4, "#FFFFFF");
  rect(x, top - 4, w, 2, "#FFFFFF");
}
function drawTower(x, base, w, h, wall, shade, roof) {
  rect(x, base - h, w, h, wall);
  rect(x + w - 4, base - h, 4, h, shade);
  rect(x + w / 2 - 2, base - h + 12, 4, 6, "#FFE27A");
  drawRoof(x - 2, base - h, w + 4, roof);
}
const LIGHT_COLORS = ["#FF5A6E", "#FFE27A", "#6FE3A0", "#7FB8FF"];
function drawCastle(cx, cy) {
  const ox = Math.round(560 - cx * 0.1), base = Math.round(300 - cy * 0.1);
  const wall = "#E9E2F7", shade = "#C9BEE6";
  drawTower(ox - 84, base, 20, 96, wall, shade, "#2F9E5B");
  drawTower(ox + 64, base, 20, 96, wall, shade, "#2F9E5B");
  drawTower(ox - 44, base, 18, 120, wall, shade, "#D8344A");
  drawTower(ox + 26, base, 18, 120, wall, shade, "#D8344A");
  drawTower(ox - 14, base, 28, 150, wall, shade, "#D8344A");
  rect(ox - 70, base - 64, 140, 64, wall);
  for (let i = 0; i < 12; i++) { rect(ox - 70 + i * 12, base - 70, 6, 6, wall); rect(ox - 70 + i * 12, base - 72, 6, 2, "#FFFFFF"); }
  rect(ox - 12, base - 34, 24, 34, "#8E5A3C");
  rect(ox - 8, base - 38, 16, 4, "#8E5A3C");
  rect(ox - 4, base - 24, 8, 8, "#2F9E5B"); // 문 위 리스
  rect(ox - 2, base - 22, 4, 4, "#8E5A3C");
  rect(ox - 1, base - 18, 2, 2, "#FF5A6E");
  for (const wx of [-52, -32, 24, 44]) rect(ox + wx, base - 46, 6, 8, "#FFE27A");
  for (let i = 0; i < 18; i++) { // 성벽 전구 줄
    const on = Math.sin(time * 4 + i * 1.7) > -0.2;
    rect(ox - 68 + i * 8, base - 60 + (i % 2) * 2, 2, 2, on ? LIGHT_COLORS[i % 4] : "#8C80B0");
  }
}

// 대형 크리스마스 트리 (먼 배경)
function drawTree(cx, cy) {
  const ox = Math.round(820 - cx * 0.12), base = Math.round(306 - cy * 0.12);
  rect(ox - 6, base - 16, 12, 16, "#7A4A2E");
  const tiers = [[0, 64, 30], [26, 52, 28], [50, 40, 26], [72, 28, 22]];
  for (const [dy, half, h] of tiers) {
    for (let k = 0; k < h; k += 4) {
      const hw = Math.round((half * (k + 4)) / h / 4) * 4;
      rect(ox - hw, base - 16 - dy - h + k, hw * 2, 4, k % 8 ? "#2C8A50" : "#36A060");
    }
    rect(ox - half, base - 16 - dy - 4, half * 2, 4, "#FFFFFF"); // 가지 끝 눈
  }
  for (let i = 0; i < 16; i++) { // 오너먼트
    const t = hash(i, 21), yy = 20 + (t % 76), half = Math.max(8, 64 - yy * 0.55);
    const xx = ((t >>> 8) % (half * 2)) - half;
    const on = Math.sin(time * 3 + i) > -0.4;
    rect(ox + xx, base - 16 - yy, 4, 4, on ? LIGHT_COLORS[i % 4] : "#1E6B3C");
  }
  const tw = Math.sin(time * 3) > 0 ? "#FFF2A8" : "#FFD84D"; // 꼭대기 별
  rect(ox - 2, base - 120, 4, 12, tw); rect(ox - 6, base - 116, 12, 4, tw);
}

// 흘러가는 구름 (밤 색조)
const CLOUD_SPAN = 7 * 240;
const CLOUDS = Array.from({ length: 7 }, (_, i) => ({ x: i * 240 + hash(i, 7) % 90, y: 14 + hash(i, 8) % 110, s: 1 + hash(i, 9) % 2 }));
function drawCloud(x, y, s) {
  const u = 4 * s;
  rect(x + u, y + 5 * u, 10 * u, u, "#9C86C4");
  rect(x, y + 2 * u, 12 * u, 3 * u, "#D9CFF0");
  rect(x + 2 * u, y + u, 5 * u, 2 * u, "#E9E2F7");
  rect(x + 5 * u, y, 4 * u, 2 * u, "#E9E2F7");
  rect(x + 8 * u, y + u, 3 * u, 2 * u, "#E9E2F7");
}
function drawClouds(cx) {
  for (const c of CLOUDS) {
    const x = (((c.x - cx * 0.2 - time * 6) % CLOUD_SPAN) + CLOUD_SPAN) % CLOUD_SPAN - 120;
    if (x > W || x < -100) continue;
    drawCloud(x, c.y, c.s);
  }
}

// 눈 덮인 파랄랙스 언덕 (4px 기둥), pines>0이면 소나무를 심는다
function drawHills(cx, cy, par, base, amp, f1, f2, col, top, pines) {
  const off = cx * par, by = base - cy * par;
  for (let x = 0; x < W; x += 4) {
    const wx = x + off;
    const h = amp * (0.6 + 0.4 * Math.sin(wx / f1)) + amp * 0.35 * Math.sin(wx / f2 + 1.3);
    const y = Math.round((by - h) / 4) * 4;
    rect(x, y, 4, H - y, col);
    rect(x, y, 4, 4, top);
    const col4 = Math.floor(wx / 4);
    if (pines && hash(col4, 77) % pines === 0) { // 작은 소나무
      rect(x, y - 16, 4, 4, "#2C7A4B"); rect(x - 4, y - 12, 12, 4, "#2C7A4B");
      rect(x - 4, y - 8, 12, 4, "#246A40"); rect(x, y - 4, 4, 4, "#6B4430");
      rect(x, y - 16, 4, 2, "#FFFFFF");
    }
  }
}

// 내리는 눈 (상태 없음: 시간으로 위치 계산)
const SNOW = Array.from({ length: 90 }, (_, i) => ({ x: hash(i, 31) % W, y: hash(i, 32) % H, v: 14 + hash(i, 33) % 22, ph: (hash(i, 34) % 628) / 100, s: 1 + (hash(i, 35) % 3 === 0 ? 1 : 0) }));
function drawSnow(cx) {
  for (const f of SNOW) {
    const x = ((((f.x + Math.sin(time * 1.3 + f.ph) * 6 - cx * 0.35 * f.s) % W) + W) % W);
    const y = (f.y + time * f.v * f.s) % H;
    rect(x, y, f.s * 2, f.s * 2, f.s > 1 ? "#FFFFFF" : "#E9E6FA");
  }
}

function drawCandyCane(x, y) { // 5x9 지팡이 사탕
  rect(x + 1, y, 3, 1, "#FFFFFF"); rect(x, y + 1, 1, 2, "#E8283E"); rect(x + 4, y + 1, 1, 2, "#FFFFFF");
  rect(x + 1, y + 1, 1, 1, "#E8283E"); rect(x + 3, y, 1, 1, "#E8283E");
  for (let k = 3; k < 9; k++) rect(x + 4, y + k, 1, 1, k % 2 ? "#E8283E" : "#FFFFFF");
}
function drawHolly(x, y) { // 호랑가시나무 잎 + 열매
  rect(x, y + 1, 3, 2, "#2C8A50"); rect(x + 4, y + 1, 3, 2, "#2C8A50");
  rect(x + 3, y, 1, 1, "#E8283E"); rect(x + 2, y + 1, 1, 1, "#E8283E"); rect(x + 4, y + 1, 1, 1, "#C01E33");
}

// 타일: 바닥은 눈 덮인 진저브레드, 공중 블록은 행마다 색이 바뀌는 선물 상자
const GIFTS = [["#E8404F", "#B32A3A", "#FFE27A"], ["#3FAE6A", "#2A7F4C", "#FFFFFF"], ["#F2C14E", "#C8962C", "#E8404F"], ["#5B8DEF", "#3D66C2", "#FFFFFF"], ["#F08BC3", "#C9619C", "#FFFFFF"]];
function drawTile(tx, ty, sx, sy) {
  const h = hash(tx, ty);
  const open = !solidAt(tx, ty - 1);
  if (ty >= LEVEL.length - 2) {
    rect(sx, sy, TILE, TILE, "#C98B5A");
    rect(sx, sy + TILE - 2, TILE, 2, "#A9703F");
    rect(sx + 3 + (h % 8), sy + 7 + ((h >>> 3) % 5), 2, 2, "#8A5530");
    if (h % 3 === 0) rect(sx + ((h >>> 6) % 12), sy + 11 + ((h >>> 9) % 2), 2, 2, "#E8DCC8");
    if (open) {
      const d = (h >>> 4) % 4;
      rect(sx, sy, TILE, 5, "#FFFFFF");
      rect(sx, sy + 4, TILE, 1, "#DDE6F5");
      rect(sx + 2 + d, sy + 5, 3, 2 + (h % 3), "#FFFFFF");
      rect(sx + 10 - d, sy + 5, 2, 1 + ((h >>> 2) % 3), "#FFFFFF");
      rect(sx + 5 + d, sy + 1, 1, 1, "#C7D6F2"); // 반짝임
      const deco = (h >>> 12) % 8;
      if (deco === 0) drawCandyCane(sx + 5, sy - 9);
      else if (deco === 1) drawHolly(sx + 4, sy - 3);
    }
  } else {
    const [c, d, rib] = GIFTS[ty % GIFTS.length];
    rect(sx, sy, TILE, TILE, d);
    rect(sx + 1, sy + 1, TILE - 2, TILE - 2, c);
    rect(sx + 7, sy + 1, 2, TILE - 2, rib); // 리본 세로
    rect(sx + 1, sy + 7, TILE - 2, 2, rib); // 리본 가로
    rect(sx + 2, sy + 2, 3, 2, "#FFFFFF");  // 광택
    if (open) {
      rect(sx, sy - 1, TILE, 3, "#FFFFFF");  // 눈 모자
      rect(sx + (h % 2 ? 2 : 10), sy + 2, 4, 1, "#FFFFFF");
      if (h % 4 === 0) { rect(sx + 5, sy - 4, 2, 3, rib); rect(sx + 9, sy - 4, 2, 3, rib); rect(sx + 7, sy - 3, 2, 2, rib); } // 리본 매듭
    }
  }
}

function render() {
  // 카메라는 한 번만 반올림해 타일과 스프라이트가 같은 정수 오프셋을 쓰게 한다
  const cx = Math.round(cam.x), cy = Math.round(cam.y);
  drawSky();
  drawStars(cx);
  drawMoon(cx, cy);
  drawClouds(cx);
  drawCastle(cx, cy);
  drawTree(cx, cy);
  drawHills(cx, cy, 0.3, 300, 60, 110, 41, "#B9B6E3", "#E4E2F8", 0);
  drawHills(cx, cy, 0.55, 336, 40, 70, 27, "#E8EEFC", "#FFFFFF", 9);

  const tx0 = Math.floor(cx / TILE), tx1 = Math.floor((cx + W - 1) / TILE);
  const ty0 = Math.floor(cy / TILE), ty1 = Math.floor((cy + H - 1) / TILE);
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (!solidAt(tx, ty) || tx < 0 || tx >= LEVEL[0].length || ty < 0 || ty >= LEVEL.length) continue;
      drawTile(tx, ty, tx * TILE - cx, ty * TILE - cy);
    }
  }

  for (const q of particles) drawHeart(q.x - cx - 2, q.y - cy - 2, q.c);
  drawSnow(cx);

  const p = player;
  const frame = CLAWD_FRAMES[Math.floor(p.animT / IDLE_FRAME_TIME) % 2];
  drawClawd(ctx, p.x - SPRITE_OX - cx, p.y - SPRITE_OY - cy, p.facing < 0, frame);
}

function burst(x, y) { // 더블 점프 하트 이펙트
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    particles.push({ x, y, vx: Math.cos(a) * 70, vy: Math.sin(a) * 45 + 30, life: 0.45, c: i % 2 ? "#FF5A6E" : "#FFFFFF" });
  }
}

// ---- 루프 ----
let last = null, acc = 0;
function frame(t) {
  if (last === null) last = t;
  const dt = (t - last) / 1000;
  last = t;
  acc = Math.min(acc + dt, 0.25);
  let n = 0;
  while (acc >= STEP && n++ < 5) {
    update(STEP);
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
